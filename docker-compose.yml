name: movieplatform

x-postgres: &postgres
  image: postgres:16
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
    interval: 5s
    timeout: 5s
    retries: 10

services:
  identity-db:
    <<: *postgres
    environment:
      POSTGRES_DB: identity_db
      POSTGRES_USER: identity_user
      POSTGRES_PASSWORD_FILE: /run/secrets/identity_db_password
    secrets: [identity_db_password]
    volumes: [identity-db-data:/var/lib/postgresql/data]
    ports: ["127.0.0.1:5433:5432"]

  catalog-db:
    <<: *postgres
    environment:
      POSTGRES_DB: catalog_db
      POSTGRES_USER: catalog_user
      POSTGRES_PASSWORD_FILE: /run/secrets/catalog_db_password
    secrets: [catalog_db_password]
    volumes: [catalog-db-data:/var/lib/postgresql/data]
    ports: ["127.0.0.1:5434:5432"]

  engagement-db:
    <<: *postgres
    environment:
      POSTGRES_DB: engagement_db
      POSTGRES_USER: engagement_user
      POSTGRES_PASSWORD_FILE: /run/secrets/engagement_db_password
    secrets: [engagement_db_password]
    volumes: [engagement-db-data:/var/lib/postgresql/data]
    ports: ["127.0.0.1:5435:5432"]

  social-db:
    <<: *postgres
    environment:
      POSTGRES_DB: social_db
      POSTGRES_USER: social_user
      POSTGRES_PASSWORD_FILE: /run/secrets/social_db_password
    secrets: [social_db_password]
    volumes: [social-db-data:/var/lib/postgresql/data]
    ports: ["127.0.0.1:5436:5432"]

  intelligence-db:
    <<: *postgres
    environment:
      POSTGRES_DB: intelligence_db
      POSTGRES_USER: intelligence_user
      POSTGRES_PASSWORD_FILE: /run/secrets/intelligence_db_password
    secrets: [intelligence_db_password]
    volumes: [intelligence-db-data:/var/lib/postgresql/data]
    ports: ["127.0.0.1:5437:5432"]

  notification-db:
    <<: *postgres
    environment:
      POSTGRES_DB: notification_db
      POSTGRES_USER: notification_user
      POSTGRES_PASSWORD_FILE: /run/secrets/notification_db_password
    secrets: [notification_db_password]
    volumes: [notification-db-data:/var/lib/postgresql/data]
    ports: ["127.0.0.1:5438:5432"]

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis-data:/data]
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    hostname: rabbitmq
    restart: unless-stopped
    entrypoint:
      - bash
      - -c
      - |
        export RABBITMQ_DEFAULT_USER="$$(tr -d '\r\n' < /run/secrets/rabbitmq_user)"
        export RABBITMQ_DEFAULT_PASS="$$(tr -d '\r\n' < /run/secrets/rabbitmq_password)"
        exec docker-entrypoint.sh rabbitmq-server
    secrets: [rabbitmq_user, rabbitmq_password]
    volumes: [rabbitmq-data:/var/lib/rabbitmq]
    ports:
      - "127.0.0.1:5672:5672"     
      - "127.0.0.1:15672:15672"   
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  identity-db-data:
  catalog-db-data:
  engagement-db-data:
  social-db-data:
  intelligence-db-data:
  notification-db-data:
  redis-data:
  rabbitmq-data:

secrets:
  identity_db_password:
    file: ./secrets/identity_db_password
  catalog_db_password:
    file: ./secrets/catalog_db_password
  engagement_db_password:
    file: ./secrets/engagement_db_password
  social_db_password:
    file: ./secrets/social_db_password
  intelligence_db_password:
    file: ./secrets/intelligence_db_password
  notification_db_password:
    file: ./secrets/notification_db_password
  rabbitmq_user:
    file: ./secrets/rabbitmq_user
  rabbitmq_password:
    file: ./secrets/rabbitmq_password
