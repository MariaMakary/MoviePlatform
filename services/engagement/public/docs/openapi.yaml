openapi: 3.0.3
info:
  title: Engagement API
  version: 1.0.0
  description: Ratings, reviews, watchlist, history, custom lists and moderation. The contract is docs/api/engagement.md; this file matches it.
servers:
  - url: http://127.0.0.1:8003
tags:
  - name: Health
paths:
  /api/health:
    get:
      tags: [Health]
      summary: Checks the service's database and RabbitMQ connection
      security: []
      responses:
        '200':
          description: Everything is ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: The database or RabbitMQ is failing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    serviceToken:
      type: apiKey
      in: header
      name: X-Service-Token
  schemas:
    Health:
      type: object
      properties:
        status:
          type: string
          enum: [ok, degraded]
        service:
          type: string
          example: engagement
        database:
          type: string
          enum: [ok, fail]
        rabbitmq:
          type: string
          enum: [ok, fail]
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
          example: The given data was invalid.
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    Meta:
      type: object
      properties:
        current_page:
          type: integer
        last_page:
          type: integer
        total:
          type: integer
  responses:
    Unauthenticated:
      description: Missing, invalid or expired token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Authenticated but not allowed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: The resource does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationFailed:
      description: Validation failed or a business rule is broken
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
security:
  - bearerAuth: []
